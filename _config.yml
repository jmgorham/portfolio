# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Jenna Gorham - Data Analytics Professional Portfolio
email: 
description: >- # this means to ignore newlines until "baseurl:"
  Data analytics professional portfolio for Jenna Gorham, containing relevant
  analytical projects demonstrating a range of relevant skills, including multiple
  tools, analytical techniques, and soft skills including effective communication
  and business insight.
twitter_username: 
github_username: jmgorham
minimal_mistakes_skin: dark
search: false

url: https://jmgorham.github.io
baseurl: /portfolio
classes: wide
collection: portfolio
entries_layout: grid

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: ./:title/
paginate: 5 # amount of posts to show
paginate_path: ./page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Jenna Gorham"
  avatar : "./assets/images/headshot_photo.png"
  bio    : "I bring a combination of statistical rigor, technological expertise, and genuine curiosity to solve challenging problems in analytics and data science. I excel in translating raw data into actionable business insights and communicating results effectively through data storytelling and visualization."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jmgorham/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jmgorham"

footer:
  links:

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false
      share: false


category_archive:
  type: liquid
  path: 
tag_archive:
  type: liquid
  path: /tags/

# Hide feed
atom_feed:
  hide: true

# Add portfolio collection
collections:
  portfolio:
    output: true
    permalink: ./:path/

